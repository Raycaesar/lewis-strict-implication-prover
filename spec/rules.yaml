spec_version: '0.6'
component: rules
project: lewis-strict-implication-prover
status: frozen_m0
scope:
  theorem_mode_only: true
  assumptions_supported_in_m0: false
  note: The initial prover establishes theorems of S1-S5. Premise consequence may be added later as a separate layer.
canonical_certificate_contract:
  contract_version: '1.1'
  authority: sole_machine_readable_certificate_authority
  closed_world: true
  unknown_fields_policy: reject
  identifier_policy:
    string_identity: exact_unicode_codepoint_sequence_no_coercion
    proof_id_type: nonempty_string
    node_id_type: nonempty_string
    root_reference_type: nonempty_string
    parent_reference_type: nonempty_string
    schema_id_type: nonempty_string
    definition_id_type: nonempty_string
    reference_resolution: exact_string_identity_no_numeric_or_text_coercion
  top_level:
    required_fields:
    - proof_id
    - system
    - basis_id
    - goal
    - root
    - nodes
    allowed_fields:
    - proof_id
    - system
    - basis_id
    - goal
    - root
    - nodes
    unknown_fields_policy: reject
  node:
    required_fields:
    - conclusion
    - justification
    allowed_fields:
    - conclusion
    - justification
    unknown_fields_policy: reject
    node_map_key_type: nonempty_string
  occurrence_path:
    payload_type: list_of_strings
    root: []
    legal_segments:
    - arg
    - left
    - right
    traversable_fields:
      atom: []
      neg:
      - arg
      poss:
      - arg
      and:
      - left
      - right
      or:
      - left
      - right
      strict_imp:
      - left
      - right
      equiv_s:
      - left
      - right
    unknown_segments_policy: reject
    definition_expansion_during_traversal: forbidden
  kinds:
    postulate_instance:
      is_lewis_inference_rule: false
      parent_arity: 0
      required_fields:
      - kind
      - schema_id
      - schema_substitution
      allowed_fields:
      - kind
      - schema_id
      - schema_substitution
      unknown_fields_policy: reject
      schema_substitution:
        key_namespace: schema_metavariables
        domain_policy: exact_schema_metavariable_set
        missing_keys_policy: reject
        extra_keys_policy: reject
        value_type: object_formula_without_schema_metavariables
        application_policy: single_simultaneous_instantiation
      schema_admission_policy: schema_id_must_be_primitive_in_declared_basis_id
      conclusion_policy: exact_surface_ast_of_instantiated_schema
    Sa:
      is_lewis_inference_rule: true
      parent_arity: 1
      parent_roles:
      - source_theorem
      required_fields:
      - kind
      - parents
      - atom_substitution
      allowed_fields:
      - kind
      - parents
      - atom_substitution
      unknown_fields_policy: reject
      atom_substitution:
        key_namespace: object_atom_names
        domain_policy: nonempty_subset_of_parent_object_atoms
        extra_keys_policy: reject
        unmentioned_atoms_policy: identity
        value_type: object_formula_without_schema_metavariables
        application_policy: simultaneous_one_pass_nonrecursive
        replacement_values_rewritten_by_same_substitution: false
      implicit_definition_conversion: reject
      conclusion_policy: exact_surface_ast_after_atom_substitution
    Sb:
      is_lewis_inference_rule: true
      parent_arity: 2
      parent_roles:
      - equivalence_parent
      - target_parent
      required_fields:
      - kind
      - parents
      - direction
      - occurrence_path
      allowed_fields:
      - kind
      - parents
      - direction
      - occurrence_path
      unknown_fields_policy: reject
      direction_values:
      - left_to_right
      - right_to_left
      equivalence_root_policy: exact_surface_equiv_s
      selected_occurrence_match_policy: exact_surface_ast_source_side
      replacement_count: 1
      root_replacement_allowed: true
      implicit_definition_conversion: reject
      conclusion_policy: exact_target_ast_after_one_selected_replacement
    Ad:
      is_lewis_inference_rule: true
      parent_arity: 2
      parent_roles:
      - left_parent
      - right_parent
      required_fields:
      - kind
      - parents
      allowed_fields:
      - kind
      - parents
      unknown_fields_policy: reject
      conclusion_policy: exact_and_of_parent_conclusions_in_parent_order
      implicit_commutativity_or_reassociation: reject
      implicit_definition_conversion: reject
    Smp:
      is_lewis_inference_rule: true
      parent_arity: 2
      parent_roles:
      - antecedent_parent
      - implication_parent
      required_fields:
      - kind
      - parents
      allowed_fields:
      - kind
      - parents
      unknown_fields_policy: reject
      implication_root_policy: exact_surface_strict_imp
      antecedent_match_policy: exact_surface_ast
      conclusion_policy: exact_implication_consequent
      implicit_definition_conversion: reject
    definition_conversion:
      is_lewis_inference_rule: false
      parent_arity: 1
      parent_roles:
      - source_parent
      required_fields:
      - kind
      - parents
      - definition_id
      - direction
      - occurrence_path
      allowed_fields:
      - kind
      - parents
      - definition_id
      - direction
      - occurrence_path
      unknown_fields_policy: reject
      direction_values:
      - expand
      - contract
      definition_resolution_policy: registered_metadefinition_only
      metavariable_environment_policy: single_shared_environment
      repeated_metavariable_policy: require_exact_structural_identity
      replacement_count: 1
      implicit_additional_conversion: reject
      implicit_rule_matching_conversion: reject
      conclusion_policy: exact_surface_ast_after_one_selected_definition_replacement
  dag:
    node_ids_unique: true
    all_references_must_resolve: true
    acyclic: true
    all_nodes_reachable_from_root: true
    parents_accepted_before_child: true
    proof_formulas_forbid_schema_metavariables: true
    root_conclusion_exactly_equals_goal: true
    line_numbers_are_nonnormative_renderer_output: true
  metadata_policy: no_metadata_inside_trusted_logical_certificate
  document_boundary:
    canonical_serialized_format: utf8_json_rfc8259_object
    accepted_serialized_formats_at_kernel_boundary:
    - utf8_json_rfc8259_object
    alternative_frontend_formats: May exist only outside the trusted M0 kernel boundary and must be converted to the
      canonical JSON document before certificate-document acceptance.
    text_decoding: utf8_strict
    top_level_document_type: json_object
    duplicate_mapping_keys_policy: reject_before_mapping_construction
    duplicate_key_scope: recursive_all_json_objects
    duplicate_key_identity: exact_unicode_codepoint_sequence_after_json_string_decoding
    parser_collapse_before_duplicate_detection: forbidden
    nonstandard_json_constants: reject_nan_infinity_negative_infinity
    logical_validation_begins: only_after_successful_strict_document_decode
    decoder_conformance_fixture: scripts/certificate_document_conformance.py
    utf8_bom_policy: reject
    decoded_string_policy: unicode_scalar_values_only_no_surrogates
    decoded_value_types: objects_arrays_strings_only
    numbers_booleans_null_policy: reject_before_logical_validation
lewis_operations:
  Sa:
    project_label: Sa
    name: Uniform Substitution
    contract_kind: Sa
    source:
      work: Lewis & Langford, Symbolic Logic
      edition: 1932
      printed_page: 125
      historical_heading: Substitution
      historical_clause: (b)
      project_label_note: Sa is the project's editorial label, not a symbolic rule label printed by L&L.
      feys_crosscheck: Feys 30.21
  Sb:
    project_label: Sb
    name: Substitution of Strict Equivalents
    contract_kind: Sb
    source:
      work: Lewis & Langford, Symbolic Logic
      edition: 1932
      printed_page: 125
      historical_heading: Substitution
      historical_clause: (a)
      project_label_note: Sb is the project's editorial label, not a symbolic rule label printed by L&L.
      feys_crosscheck: Feys 30.24
  Ad:
    project_label: Ad
    name: Adjunction
    contract_kind: Ad
    source:
      work: Lewis & Langford, Symbolic Logic
      edition: 1932
      printed_page: 126
      historical_heading: Adjunction
      project_label_note: Ad is the project's editorial label.
      feys_crosscheck: Feys 30.22
  Smp:
    project_label: Smp
    name: Inference / Strict Detachment
    contract_kind: Smp
    source:
      work: Lewis & Langford, Symbolic Logic
      edition: 1932
      printed_page: 126
      historical_heading: Inference
      project_label_note: Smp is the project's editorial label; L&L call the operation Inference.
      feys_crosscheck: Feys 30.23
non_rules:
  definition_conversion:
    note: Trusted metalinguistic certificate checking, not a fifth Lewis inference rule.
  theorem_library_lookup:
    note: Untrusted macro only; must expand to a native certificate before the kernel boundary.
  system_inclusion:
    note: Never a primitive rule; cross-basis reuse requires checked bridge expansion.
explicitly_forbidden_rules:
  unrestricted_necessitation:
    display: A / Box A
    enabled: false
    reason: Not a primitive L&L rule and Box is absent from the M0 object language.
  material_modus_ponens:
    enabled: false
    reason: Material implication is absent from the M0 native core.
  semantic_validity:
    enabled: false
    reason: Kripke, matrix, algebraic, topological, truth-table, or other semantic validity is not a proof step.
  tableau_closure:
    enabled: false
  sequent_rule:
    enabled: false
  natural_deduction_rule:
    enabled: false
