spec_version: '0.5'
component: systems
project: lewis-strict-implication-prover
status: candidate_m0
normalization_policy:
  purpose: Represent only S1-S5 without duplicating L&L's overlapping A- and B-postulate lists.
  key_decisions:
  - A1-A6 are not stored as separate executable schemas. This is a normalization/derivability decision, not a claim
    that all six are literal copies of B1-B6.
  - A7 is not stored as a primitive schema; the normalized prover will carry it as a certified S1 theorem/bridge lemma.
  - Parry (1939), pp. 137-138, displays the reduced S3 postulate list 11.1-11.4, 11.6, 11.7 and 30.1/A8; 11.5 is supplied
    by the McKinsey derivation discussed on p. 138. This gives direct syntactic support for the project's unreduced
    normalized basis B1-B7+A8.
  - B9 is excluded from the propositional/modal S1-S5 core.
  - No system enables Box notation or unrestricted necessitation.
systems:
  S1:
    name: Lewis S1
    normalized_basis:
      schemas:
      - B1
      - B2
      - B3
      - B4
      - B5
      - B6
      - B7
      rules:
      - Sa
      - Sb
      - Ad
      - Smp
      basis_id: S1_B1_B7
    historical_source_note: 'L&L Appendix II: S1 is deduced from B1-B7.'
    excluded:
    - B8
    - B9
    - A8
    - C10
    - C11
    - C12
  S2:
    name: Lewis S2
    normalized_basis:
      inherit_schemas_from: S1
      add_schemas:
      - B8
      rules:
      - Sa
      - Sb
      - Ad
      - Smp
      basis_id: S2_B1_B8
    historical_source_note: 'L&L Appendix II: S2 is deduced from B1-B8.'
    excluded:
    - B9
    - A8
    - C10
    - C11
    - C12
  S3:
    name: Lewis S3
    normalized_basis:
      inherit_schemas_from: S1
      add_schemas:
      - A8
      rules:
      - Sa
      - Sb
      - Ad
      - Smp
      basis_id: S3_B1_B7_A8
    historical_basis_note: L&L p. 500 presents S3 by A1-A8. Parry (1939), pp. 137-138, displays the reduced S3 postulate
      list 11.1-11.4, 11.6, 11.7 and 30.1/A8; 11.5 is supplied by the McKinsey derivation discussed on p. 138. This
      gives direct syntactic support for the project's unreduced normalized basis B1-B7+A8.
    normalization_obligations:
    - id: S1_DERIVES_A7
      statement: 'S1 proves A7: ∼◇P ⥽ ∼P.'
      status: source_supported_kernel_pending
      source: Parry 1939 pp. 137-138
    - id: S3_NORMALIZED_BASIS_EQUIVALENCE
      statement: The normalized basis S1 + A8 generates the same S3 theorem set required by the project as L&L's A1-A8
        presentation.
      status: source_supported_kernel_pending
      source: Parry 1939 pp. 137-138
    excluded:
    - B9
    - C10
    - C11
    - C12
  S4:
    name: Lewis S4
    normalized_basis:
      inherit_schemas_from: S1
      add_schemas:
      - C10
      rules:
      - Sa
      - Sb
      - Ad
      - Smp
      basis_id: S4_B1_B7_C10
    historical_source_note: 'L&L Appendix II p. 501: S4 is deduced from B1-B7 together with C10; A8 and B8 are deductible.'
    bridge_obligations:
    - id: S4_DERIVES_S3_EXTENSION
      statement: Certify the principles needed to reuse S3 theorems in S4 without treating the primitive bases as
        literal inheritance.
      status: to_be_machine_certified
    excluded:
    - B9
    - C11
    - C12
  S5:
    name: Lewis S5
    primary_normalized_basis:
      inherit_schemas_from: S1
      add_schemas:
      - C11
      rules:
      - Sa
      - Sb
      - Ad
      - Smp
      basis_id: S5_PRIMARY_B1_B7_C11
    alternative_normalized_basis:
      inherit_schemas_from: S1
      add_schemas:
      - C10
      - C12
      rules:
      - Sa
      - Sb
      - Ad
      - Smp
      basis_id: S5_ALT_B1_B7_C10_C12
    historical_source_note: 'L&L Appendix II p. 501: S5 is deduced from B1-B7+C11, or from B1-B7+C10+C12.'
    bridge_obligations:
    - id: C10_C12_DERIVE_C11
      statement: S1 + C10 + C12 proves C11.
      historical_regression: Shen Yuting derivation
      status: to_be_machine_certified
      source: L&L p. 498 item (14) gives the derivability under that paragraph's stated A1-A8/B1-B9 background; L&L
        p. 501 canonically states the B1-B7+C10+C12 S5 presentation.
      from_basis_id: S5_PRIMARY_B1_B7_C11
      into_basis_id: S5_ALT_B1_B7_C10_C12
      recovered_primitive_schemas:
      - C11
      expanded_certificate_basis_id: S5_ALT_B1_B7_C10_C12
    - id: C11_DERIVES_C10_C12
      statement: S1 + C11 proves the C10/C12 presentation required for basis equivalence.
      status: to_be_machine_certified
      source: L&L p. 498 items (12)-(13) give the derivabilities under that paragraph's stated A1-A8/B1-B9 background;
        L&L p. 501 canonically states both B1-B7-based S5 presentations.
      from_basis_id: S5_ALT_B1_B7_C10_C12
      into_basis_id: S5_PRIMARY_B1_B7_C11
      recovered_primitive_schemas:
      - C10
      - C12
      expanded_certificate_basis_id: S5_PRIMARY_B1_B7_C11
    excluded:
    - B9
    proof_basis_policy:
      certificate_requirement: Every S5 proof certificate must declare exactly one basis_id.
      ui_default: S5_PRIMARY_B1_B7_C11
      allowed_basis_ids:
      - S5_PRIMARY_B1_B7_C11
      - S5_ALT_B1_B7_C10_C12
      union_forbidden: true
      note: The checker must never admit the union B1-B7+C10+C11+C12 as one primitive basis. Bridge records use from_basis_id/into_basis_id,
        and the expanded native certificate must declare basis_id equal to into_basis_id.
    bridge_contract:
      field_meaning:
        from_basis_id: Basis of a compact/source proof whose basis-specific primitive(s) may need translation.
        into_basis_id: Basis in which the expanded native bridge certificate is checked.
      expansion_requirement: expanded_certificate.basis_id == into_basis_id
      translation_requirement: The bridge must derive every from-basis primitive not primitive in into_basis_id using
        only primitives admitted by into_basis_id.
      field_names_are_operational: true
theorem_inclusion:
  intended_hierarchy:
  - S1
  - S2
  - S3
  - S4
  - S5
  trusted_by_kernel_without_bridge: false
  policy: The search layer may use the hierarchy only after the relevant inclusion is backed by machine-checked bridge
    certificates. Primitive-basis inheritance and theorem inclusion are distinct relations.
extensions_not_in_m0:
  B9_existence:
    enabled: false
    reason: B9 introduces propositional existence quantification and is outside the requested S1-S5 propositional/modal
      prover core.
certificate_basis_policy:
  basis_id_required_for_every_proof: true
  system_basis_ids:
    S1:
    - S1_B1_B7
    S2:
    - S2_B1_B8
    S3:
    - S3_B1_B7_A8
    S4:
    - S4_B1_B7_C10
    S5:
    - S5_PRIMARY_B1_B7_C11
    - S5_ALT_B1_B7_C10_C12
  schema_admission: A postulate_instance is accepted only if schema_id belongs to the exact resolved schema set of
    the declared basis_id.
  bridge_metadata:
  - from_basis_id
  - into_basis_id
  bridge_expansion_rule: expanded_certificate.basis_id == into_basis_id
