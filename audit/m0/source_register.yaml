register_version: '0.5'
project: lewis-strict-implication-prover
stage: M0
status: candidate_source_audit
canonical_source:
  id: LL1932
  author: C. I. Lewis and C. H. Langford
  title: Symbolic Logic
  edition: 2nd ed. (1932); supplied Dover 1959 reprint
  repository_path: Strict_Implication/Symbolic Logic_Lewis_Langford_1959.pdf
  authority: canonical_for_native_calculus
  note: Printed page numbers below refer to the book pagination reproduced by the Dover reprint.
secondary_sources:
  PARRY1939:
    author: William Tuthill Parry
    title: Modalities in the Survey System of Strict Implication
    year: 1939
    repository_path: Strict_Implication/Parry-1939.pdf
    authority: secondary_syntactic
    use:
    - Parry (1939), pp. 137-138, displays the reduced S3 postulate list 11.1-11.4, 11.6, 11.7 and 30.1/A8; 11.5 is
      supplied by the McKinsey derivation discussed on p. 138. This gives direct syntactic support for the project's
      unreduced normalized basis B1-B7+A8.
    - Provides syntactic modal results and later bridge material.
  FEYS:
    author: Robert Feys
    title: Modal Logics
    repository_path: Strict_Implication/feys_modal_logic.pdf
    authority: secondary_syntactic
    use:
    - Derived-rule and proof-template library.
    - Cross-check of substitution, adjunction, strict detachment, and replacement of strict equivalents.
  MCKINSEY1934:
    author: J. C. C. McKinsey
    year: 1934
    repository_path: Strict_Implication/McKinsey-1934.pdf
    authority: secondary_syntactic
    use:
    - Redundancy and proof-minimization information.
  HUGHES_CRESSWELL:
    repository_path: Strict_Implication/hugn_max.pdf
    authority: modern_crosscheck_only
    use:
    - Modern reconstruction and warning against importing unrestricted necessitation into S1-S3.
  LEWIS1918:
    repository_path: Strict_Implication/Lewis_A_Survey_of_Symbolic_Logic_1918.pdf
    authority: historical_reference_only
language_and_definitions:
  primitive_ideas_LL:
    source:
      source_id: LL1932
      printed_page: 123
      locus: Chapter VI, Section 1
    historical_items:
    - propositions
    - negation
    - logical_product
    - possibility_or_self_consistency
    - logical_equivalence
    project_normalization:
    - Keep neg, and, poss as primitive core constructors.
    - Retain strict_imp as a first-class defined surface node.
    - Represent L&L logical equivalence by equiv_s rather than object-language '='.
    - Do not introduce Box in M0.
    status: source_verified
  DEF_OR:
    source:
      source_id: LL1932
      printed_page: 123
      historical_number: '11.01'
    historical_form: p ∨ q =df ∼(∼p ∼q)
    project_id: DEF_OR
    status: source_verified
  DEF_STRICT_IMP:
    source:
      source_id: LL1932
      printed_page: 124
      historical_number: '11.02'
    historical_form: p fishhook q =df ∼◇(p ∼q)
    project_id: DEF_STRICT_IMP
    status: source_verified
  DEF_EQUIV_S:
    source:
      source_id: LL1932
      printed_page: 124
      historical_number: '11.03'
    historical_form: p = q =df (p fishhook q)(q fishhook p)
    project_form: p equiv_s q := (p fishhook q)(q fishhook p)
    caution: L&L also lists logical equivalence among the primitive/undefined ideas on p. 123 and explicitly comments
      on this at p. 124. The kernel-level status of equiv_s therefore requires an explicit normalization decision
      before M0 freeze.
    status: source_verified
    project_normalization_status: M0.5 retains equiv_s as a first-class surface node with explicit checked definition_conversion,
      single-authority certificate semantics, and no implicit rule-time elaboration.
primitive_operations:
  Sa:
    project_label: Sa
    project_name: Uniform Substitution
    source:
      source_id: LL1932
      printed_page: 125
      historical_heading: Substitution
      historical_clause: (b)
    source_summary: Any proposition or meaningful expression may be substituted uniformly for p, q, r, etc. in an
      assumption or established theorem.
    note: Sa is a project/editorial label, not an L&L symbolic rule label.
    feys_crosscheck: Feys 30.21, Rule of substitution.
    status: source_verified
  Sb:
    project_label: Sb
    project_name: Substitution of Equivalents
    source:
      source_id: LL1932
      printed_page: 125
      historical_heading: Substitution
      historical_clause: (a)
    source_summary: Either of two equivalent expressions may be substituted for the other.
    note: Sb is a project/editorial label, not an L&L symbolic rule label.
    feys_crosscheck: Feys 30.24, replacement of strict equivalents.
    status: source_verified
  Ad:
    project_label: Ad
    project_name: Adjunction
    source:
      source_id: LL1932
      printed_page: 126
      historical_heading: Adjunction
    source_summary: Separately asserted p and q may be jointly asserted as pq.
    note: Ad is a project/editorial label.
    feys_crosscheck: Feys 30.22.
    status: source_verified
  Smp:
    project_label: Smp
    project_name: Strict Modus Ponens
    source:
      source_id: LL1932
      printed_page: 126
      historical_heading: Inference
    source_summary: From asserted p and asserted p fishhook q, infer q.
    note: Smp is a project/editorial label; L&L call the operation Inference.
    feys_crosscheck: Feys 30.23, detachment for strict implication.
    status: source_verified
