register_version: "0.2"
project: lewis-strict-implication-prover
stage: M0
freeze_allowed_with_open_blockers: false

obligations:
  M0-L01:
    category: language
    title: "Primitive/core language mapping"
    requirement: "Verify the project mapping of proposition letters, negation, product, possibility, and strict-equivalence notation against L&L pp. 123-124."
    status: source_verified
    evidence: ["LL1932 p. 123", "LL1932 p. 124"]

  M0-D01:
    category: definitions
    title: "Disjunction definition"
    requirement: "Verify DEF_OR against 11.01."
    status: source_verified
    evidence: ["LL1932 p. 123, 11.01"]

  M0-D02:
    category: definitions
    title: "Strict implication definition"
    requirement: "Verify the fishhook definition against 11.02 and preserve fishhook surface notation."
    status: source_verified
    evidence: ["LL1932 p. 124, 11.02"]

  M0-D03:
    category: definitions
    title: "Strict equivalence normalization"
    requirement: "Resolve the kernel status of equiv_s given that L&L list logical equivalence as primitive on p. 123 but give 11.03 on p. 124. Specify exactly how definition expansion/contraction interacts with Sb."
    status: blocked
    severity: P0_M0_FREEZE_BLOCKER
    evidence: ["LL1932 pp. 123-124, 11.03"]
    proposed_resolution:
      - "Keep equiv_s as a first-class object-language surface node distinct from metalanguage '='."
      - "Treat 11.03 as trusted definitional conversion, not as an additional logical inference rule."
      - "Require the M1 certificate format to record any definition conversion that changes the visible proof line."

  M0-D04:
    category: definitions
    title: "Deterministic definition conversion policy"
    requirement: "Replace the current permissive phrase 'the kernel may elaborate' by a deterministic policy for or, strict_imp, and equiv_s."
    status: blocked
    severity: P0_M0_FREEZE_BLOCKER
    proposed_resolution:
      - "Surface proof formulas retain defined connectives."
      - "Rule applications check declared surface structure."
      - "Definition expansion/contraction is a separately checked metalinguistic conversion, never an unrecorded proof search step."

  M0-R01:
    category: rules
    title: "Rule provenance and labels"
    requirement: "Distinguish project labels Sa/Sb/Ad/Smp from L&L's historical headings and clauses."
    status: repair_needed
    severity: P1
    evidence:
      - "LL1932 p. 125: Substitution clauses (a) and (b)"
      - "LL1932 p. 126: Adjunction and Inference"
      - "Feys 30.21-30.24"

  M0-R02:
    category: rules
    title: "Uniform substitution contract"
    requirement: "Verify whole-formula uniformity and theorem-mode restriction."
    status: source_verified
    evidence: ["LL1932 p. 125, Substitution (b)"]

  M0-R03:
    category: rules
    title: "Replacement of strict equivalents contract"
    requirement: "Verify bidirectional replacement and target-theorem discipline; define occurrence-path checking without strengthening the historical operation."
    status: source_verified
    evidence: ["LL1932 p. 125, Substitution (a)", "Feys 30.24"]

  M0-R04:
    category: rules
    title: "Adjunction"
    requirement: "Verify exact two-premise operation."
    status: source_verified
    evidence: ["LL1932 p. 126"]

  M0-R05:
    category: rules
    title: "Inference / strict detachment"
    requirement: "Verify that the rule is from p and p fishhook q to q, distinct from B7."
    status: source_verified
    evidence: ["LL1932 p. 126"]

  M0-A01:
    category: schemas
    title: "B1-B7 source transcription"
    requirement: "Audit every AST parenthesis and connective against Chapter VI and Appendix II."
    status: source_verified
    evidence: ["LL1932 pp. 124-125", "LL1932 p. 493"]

  M0-A02:
    category: schemas
    title: "B8 source transcription"
    requirement: "Audit B8 against Appendix II and Chapter VI 19.01."
    status: source_verified
    evidence: ["LL1932 p. 493", "Parry 1939 p. 137"]

  M0-A03:
    category: schemas
    title: "A8 source transcription"
    requirement: "Audit A8 punctuation and nesting against Appendix II."
    status: source_verified
    evidence: ["LL1932 p. 493"]

  M0-A04:
    category: schemas
    title: "C10 source transcription"
    requirement: "Audit the native diamond/negation form without introducing Box."
    status: source_verified
    evidence: ["LL1932 p. 497"]

  M0-A05:
    category: schemas
    title: "C11 source transcription"
    requirement: "Audit the native diamond/negation form without introducing Box."
    status: source_verified
    evidence: ["LL1932 p. 497"]

  M0-A06:
    category: schemas
    title: "C12 source transcription"
    requirement: "Audit the native diamond/negation form without introducing Box."
    status: source_verified
    evidence: ["LL1932 p. 497"]

  M0-N01:
    category: normalization
    title: "A-series nonduplication wording"
    requirement: "Do not claim A1-A6 are formula-for-formula duplicates of B1-B6. A2 and A4 are not literal duplicates. State instead that separate executable copies are unnecessary because the normalized S1 basis recovers the A-series principles needed for S3."
    status: repair_needed
    severity: P1
    evidence: ["LL1932 p. 493", "Parry 1939 pp. 137-138"]

  M0-N02:
    category: normalization
    title: "S3 normalized basis"
    requirement: "Justify S3 = normalized S1 + A8 without conflating it with the literal L&L A1-A8 presentation."
    status: source_supported
    evidence:
      - "LL1932 p. 500"
      - "Parry 1939 pp. 137-138"
    machine_certificate: pending

  M0-S01:
    category: systems
    title: "S1 basis"
    requirement: "B1-B7."
    status: source_verified
    evidence: ["LL1932 p. 500"]

  M0-S02:
    category: systems
    title: "S2 basis"
    requirement: "B1-B8."
    status: source_verified
    evidence: ["LL1932 p. 500"]

  M0-S03:
    category: systems
    title: "S4 basis"
    requirement: "B1-B7 + C10."
    status: source_verified
    evidence: ["LL1932 p. 501"]

  M0-S04:
    category: systems
    title: "S5 primary and alternative bases"
    requirement: "B1-B7 + C11, or B1-B7 + C10 + C12."
    status: source_verified
    evidence: ["LL1932 p. 501"]

  M0-B01:
    category: bridges
    title: "S4 contains S3"
    requirement: "Do not implement by blind primitive-basis inheritance; future library requires native target-system certificates."
    status: source_verified
    evidence: ["LL1932 p. 501"]
    machine_certificate: pending

  M0-B02:
    category: bridges
    title: "S5 basis equivalence"
    requirement: "Machine-certify both directions needed by the prover's alternative-basis interface."
    status: source_verified
    evidence:
      - "LL1932 p. 498 items (12)-(14)"
      - "LL1932 pp. 499, 501"
    machine_certificate: pending

  M0-E01:
    category: exclusions
    title: "B9 excluded from M0"
    requirement: "Keep propositional-existence machinery outside the initial core."
    status: source_verified
    evidence: ["LL1932 pp. 493, 500-501"]

  M0-C01:
    category: certificate
    title: "Definition conversion certificate"
    requirement: "Decide whether visible 'by definition' transformations are represented as explicit non-rule conversion nodes. The checker must not silently change displayed formulas."
    status: blocked
    severity: P0_M0_FREEZE_BLOCKER
    dependencies: [M0-D03, M0-D04]

  M0-C02:
    category: certificate
    title: "Postulate instance semantics"
    requirement: "Distinguish a registered schema instance from a separate Sa proof line while preserving the ability to render explicit substitution when desired."
    status: open
    severity: P1

  M0-C03:
    category: certificate
    title: "Sb occurrence paths"
    requirement: "Specify a stable structural path grammar and check one explicit occurrence per primitive Sb step."
    status: open
    severity: P1

summary:
