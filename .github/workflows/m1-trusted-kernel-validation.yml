name: M1 trusted kernel validation

on:
  push:
    paths:
      - "src/lewis_prover/**"
      - "tests/**"
      - "scripts/**"
      - "spec/**"
      - "audit/m0/**"
      - "audit/m1/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/lewis_prover/**"
      - "tests/**"
      - "scripts/**"
      - "spec/**"
      - "audit/m0/**"
      - "audit/m1/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m1-trusted-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and frozen provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Preserve all M0 gates
        run: bash scripts/run_m0_checks.sh

      - name: Run complete M0 and M1 tests
        run: python -m pytest

      - name: Verify frozen files, semantic non-regression, and administrative provenance
        run: python scripts/verify_m1_frozen_baseline.py

      - name: Check production CLI acceptance and rejection
        run: python scripts/run_m1_cli_smoke.py

      - name: Check whitespace in worktree and candidate commit
        run: |
          git diff --check
          git diff --check HEAD^ HEAD
